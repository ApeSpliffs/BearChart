<!doctype html><meta charset="utf-8"><title>icon</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  svg{display:block}
</style>
<!-- The app icon. The site's own bear over the chart mark from the masthead:
     what it is (bears) and what it does (prices) in one glyph, still legible
     at 48px on a home screen. SAFE=1 draws the maskable version, which keeps
     everything inside the circle Android crops to. -->
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fdf3e0"/>
      <stop offset="1" stop-color="#f3d9a8"/>
    </linearGradient>
  </defs>
  <g id="plate"></g>
  <g id="art">
    <!-- ears -->
    <circle cx="180" cy="182" r="46" fill="#5a3d26"/>
    <circle cx="332" cy="182" r="46" fill="#5a3d26"/>
    <circle cx="180" cy="182" r="23" fill="#e9c9a0"/>
    <circle cx="332" cy="182" r="23" fill="#e9c9a0"/>
    <!-- head -->
    <circle cx="256" cy="248" r="112" fill="#5a3d26"/>
    <ellipse cx="256" cy="292" rx="55" ry="43" fill="#e9c9a0"/>
    <ellipse cx="256" cy="270" rx="21" ry="15" fill="#5a3d26"/>
    <circle cx="214" cy="230" r="13" fill="#e9c9a0"/>
    <circle cx="298" cy="230" r="13" fill="#e9c9a0"/>
    <!-- the chart: what the guide is for. Clear of the chin, centred under it. -->
    <rect x="164" y="418" width="34" height="34" rx="8" fill="#e9a03b"/>
    <rect x="214" y="398" width="34" height="54" rx="8" fill="#c67f1c"/>
    <rect x="264" y="374" width="34" height="78" rx="8" fill="#d4485e"/>
    <rect x="314" y="392" width="34" height="60" rx="8" fill="#3e8ba8"/>
  </g>
</svg>
<script>
  var p = new URLSearchParams(location.search);
  var maskable = p.get('safe') === '1';
  var svg = document.getElementById('icon');
  var size = Number(p.get('size') || 512);
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);

  // A maskable icon gets cropped to a circle, so the artwork shrinks into the
  // safe zone and the background bleeds to the full square.
  document.getElementById('plate').innerHTML = maskable
    ? '<rect width="512" height="512" fill="url(#bg)"/>'
    : '<rect width="512" height="512" rx="112" fill="url(#bg)"/>';
  if (maskable) {
    document.getElementById('art').setAttribute('transform',
      'translate(256 256) scale(0.76) translate(-256 -256)');
  }
</script>
