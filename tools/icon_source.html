<!doctype html><meta charset="utf-8"><title>icon</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  #icon{display:block;overflow:hidden;background:#efe9d8}
  #icon img{display:block;width:100%;height:100%}
</style>
<!-- The app icon: the Plush Price Guide bear with its price tag and rising bars,
     drawn from tools/logo_master.png (a full-bleed 1024px square). The plain
     icon gets the rounded plate; SAFE=1 draws the maskable version, which bleeds
     the cream to the full square and keeps the art inside the circle Android
     crops to. -->
<div id="icon"><img src="logo_master.png" alt=""></div>
<script>
  var p = new URLSearchParams(location.search);
  var maskable = p.get('safe') === '1';
  var size = Number(p.get('size') || 512);
  var box = document.getElementById('icon');
  box.style.width = box.style.height = size + 'px';
  if (maskable) {
    box.querySelector('img').style.transform = 'scale(0.8)';
  } else {
    box.style.borderRadius = Math.round(size * 0.22) + 'px';
  }
</script>
