# BearChart - static site, built by tools/build_site.sh.
#
# The item pages are generated from data.json at build time rather than
# committed, so this needs a real build command; deploying the repo as-is
# would serve a site with no item pages.

[build]
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "24"

# The service worker must never be served stale: a cached sw.js pins visitors
# to the previous build's precache manifest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
