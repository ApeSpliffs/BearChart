name: Plush Price Guide toolchain
description: Node + Python from repo pins, npm deps without lifecycle scripts.
inputs:
  install:
    description: Run npm ci
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    # Python is stdlib-only (no requirements file), so no pip cache.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version
    - if: inputs.install == 'true'
      shell: bash
      # --ignore-scripts: no third-party install hooks run in CI.
      # --omit=optional: sharp is only used by tools/icon_sheet.js.
      run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
