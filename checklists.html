<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklists — BearChart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Nunito+Sans:wght@400..800&display=swap">
<meta name="theme-color" content="#b3131c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BearChart">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead" id="masthead"></header>
<div class="disclaimer-bar" id="disclaimer-bar"></div>

<main>
  <div class="wrap">

    <div class="panel">
      <h2>Collector checklists</h2>
      <p class="fine">Tick what you own. Ticking adds the item to
        <a href="collection.html">your collection</a>, so the totals there stay in step.
        Stored in this browser only — nothing is uploaded.</p>
    </div>

    <div class="stats" id="overall"></div>

    <div class="columns">
      <aside class="sidebar" id="sidebar">
        <div class="panel">
          <h2>Checklists</h2>
          <div id="set-list"></div>
        </div>
      </aside>

      <section>
        <div class="panel">
          <div class="toolbar">
            <h2 style="margin:0" id="set-title">&nbsp;</h2>
            <span class="grow"></span>
            <span class="check"><input type="checkbox" id="hide-owned">
              <label for="hide-owned">Show only what I'm missing</label></span>
            <button type="button" id="export-set">Export CSV</button>
          </div>
          <div id="set-progress"></div>
          <div id="set-body"></div>
        </div>
      </section>
    </div>

  </div>
</main>

<footer class="site" id="site-footer"></footer>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="icons.js"></script>
<script src="auth.js"></script>
<script src="entitlements.js"></script>
<script src="submissions.js"></script>
<script src="common.js"></script>
<script src="checklists.js"></script>
</body>
</html>
